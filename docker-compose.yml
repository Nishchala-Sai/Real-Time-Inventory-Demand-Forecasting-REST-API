services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Transactions need a replica set, and the set can only be initiated once mongod is up.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    # The first start can beat the replica set electing a primary, and the API exits on a failed connection.
    restart: on-failure
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/inventory?replicaSet=rs0
      # Local defaults only. Set real values in the environment for any shared deployment.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-only-refresh-secret-change-me}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      STORE_TZ: ${STORE_TZ:-UTC}

volumes:
  mongo-data:
