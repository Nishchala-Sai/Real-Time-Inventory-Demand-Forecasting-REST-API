name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

jobs:
  build:
    # Pinned because the mongod binary the tests download must support the runner's OS.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run docs:lint
      - run: npm audit --omit=dev --audit-level=high
